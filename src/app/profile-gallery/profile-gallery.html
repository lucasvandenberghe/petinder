@if (pets.isLoading()) {
  <p class="text-muted">Loading pets...</p>
} @else if (pets.error()) {
  <p class="alert alert-danger">Oops, could not load the pets. Is the backend running?</p>
} @else {
  <div class="container-fluid">
    <div class="row">
      <div id="gallery" class="col-md-9">
        <div class="gallery">
          @for (pet of pets.value(); track pet.id) {
            <div class="gallery-pet fader" [class.active]="selectedPet() === pet" (click)="selectPet(pet)">
              <img class="profile-picture" [src]="baseApiUrl + '/' + pet.image" alt=""/>
              <div class="overlay">
                <div class="overlay-text">{{ pet.name }}</div>
              </div>
            </div>
          }
        </div>
      </div>
      @if (selectedPet(); as pet) {
        <div class="col-md-3">
          <div class="gallery-detail">
            <app-pet-profile [pet]="pet" />
          </div>
        </div>
      }
    </div>
  </div>

}
