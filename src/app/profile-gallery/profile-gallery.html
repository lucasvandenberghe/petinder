@if (pets.status() === 'loading') {
  <p class="text-muted">Loading pets...</p>
} @else if (pets.error()) {
  <p class="alert alert-danger">Oops, could not load the pets. Is the backend running?</p>
} @else {
  <div class="container-fluid">
    <div class="row">
      <div id="gallery" class="col-md-9">
        <div class="gallery">
          @for (pet of filteredPets(); track pet.id) {
            <div class="gallery-pet fader" [class.active]="selectedPet()?.id === pet.id" (click)="selectPet(pet)">
              <img class="profile-picture" [src]="baseApiUrl + '/' + pet.image" alt=""/>
              <div class="overlay">
                <div class="overlay-text">{{ pet.name }}</div>
              </div>
            </div>
          }
        </div>
      </div>
      <div class="col-md-3">
        <section class="tiny-dialog">
          <h3>Find your pet</h3>
          <div class="form-group">
            <label for="name">Name</label>
            <input id="name" name="name" class="form-control" placeholder="Name" [(ngModel)]="searchText"/>
          </div>
        </section>
        <app-add-pet (petAdded)="showNewPet($event)" />
        @if (selectedPet(); as pet) {
          <div class="gallery-detail">
            <app-pet-profile [pet]="pet"/>
          </div>
        }
      </div>
    </div>
  </div>
}
